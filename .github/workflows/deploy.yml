name: Build and Deploy to ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_BACKEND_URI: ${{ secrets.ECR_BACKEND_URI }}
  ECR_FRONTEND_URI: ${{ secrets.ECR_FRONTEND_URI }}

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          IMAGE_TAG=${{ github.sha }}

          docker build -t $ECR_BACKEND_URI:$IMAGE_TAG ./backend
          docker tag $ECR_BACKEND_URI:$IMAGE_TAG $ECR_BACKEND_URI:latest

          docker push $ECR_BACKEND_URI:$IMAGE_TAG
          docker push $ECR_BACKEND_URI:latest

          echo "BACKEND_IMAGE=$ECR_BACKEND_URI:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push frontend image
        run: |
          IMAGE_TAG=${{ github.sha }}

          docker build -t $ECR_FRONTEND_URI:$IMAGE_TAG ./frontend
          docker tag $ECR_FRONTEND_URI:$IMAGE_TAG $ECR_FRONTEND_URI:latest

          docker push $ECR_FRONTEND_URI:$IMAGE_TAG
          docker push $ECR_FRONTEND_URI:latest

          echo "FRONTEND_IMAGE=$ECR_FRONTEND_URI:$IMAGE_TAG" >> $GITHUB_ENV

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster taskflow-cluster \
            --service taskflow-backend-service \
            --force-new-deployment

      - name: Deploy frontend to ECS
        run: |
          aws ecs update-service \
            --cluster taskflow-cluster \
            --service taskflow-frontend-service \
            --force-new-deployment